[package]
name = "crabipie-core"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["default-tls", "http2", "multipart", "stream", "json", "gzip", "deflate"] }
reqwest-websocket = "0.5.1"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["fs", "macros", "time", "rt", "sync"] }
url = "2.5.7"
urlencoding = "2.1.3"
futures = "0.3.31"
futures-util = "0.3.32"
chrono = "0.4.43"
flate2 = "1.1.9"
base64 = "0.23.0"
uuid = { version = "1.18.1", features = ["v4"] }
rand = "0.8.5"

[dev-dependencies]
regex = "1.13.1" # only to prove replace_vars matches the old regex behavior
tokio = { version = "1.48.0", features = ["rt", "macros", "fs", "time"] }
