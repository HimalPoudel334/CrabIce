[package]
name = "crabipie-core"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["default-tls", "http2", "multipart", "stream", "json", "gzip", "deflate"] }
reqwest-websocket = "0.5.1"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["fs", "macros", "time", "rt", "sync", "net", "io-util"] }
url = "2.5.7"
urlencoding = "2.1.3"
futures = "0.3.31"
futures-util = "0.3.32"
chrono = "0.4.43"
flate2 = "1.1.9"
base64 = "0.23.0"
uuid = { version = "1.18.1", features = ["v4"] }
# gRPC transport: HTTP/2 straight on h2 (reqwest hides trailers, which is where grpc-status lives).
# All of these are already in the build through reqwest; the alpn feature lets schannel pick h2.
h2 = "0.4.12"
http = "1.4.0"
bytes = "1.11.0"
native-tls = { version = "0.2.14", features = ["alpn"] }
tokio-native-tls = "0.3.1"

[dev-dependencies]
regex = "1.13.1" # only to prove replace_vars matches the old regex behavior
tokio = { version = "1.48.0", features = ["rt", "macros", "fs", "time", "net", "io-util"] }
